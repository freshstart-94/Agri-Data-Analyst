    <style>

        }
        .panel h3 {
            font-size: 0.85em;
            color: #333;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            font-size: 0.85em;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
        }
        .stats {
            font-size: 0.85em;
            color: #666;
        }
        #map { flex: 1; }
    </style>
</head>

        function getDrainageColor(drainage) {
            if (!drainage) return '#9E9E9E';
            if (drainage.includes('Excessively')) return '#1565C0';
            if (drainage.includes('Well drained')) return '#43A047';
            if (drainage.includes('Somewhat')) return '#FFA000';
            if (drainage.includes('Poorly')) return '#C62828';
            if (drainage.includes('Moderately')) return '#7CB342';
            return '#9E9E9E';
        }

        function getCropColor(crop) {
            if (crop === 'corn') return '#2E7D32';
            if (crop === 'soybeans') return '#F9A825';
            return '#9E9E9E';
        }

        var fieldsLayer = L.geoJSON(fieldData, {
            style: function(feature) {
                return {
                    color: '#1B5E20',
                    weight: 2,
                    fillColor: getDrainageColor(feature.properties.drainagecl),
                    fillOpacity: 0.6
                };
            },
            onEachFeature: function(feature, layer) {
                var props = feature.properties;
                var popupContent = '<b>Field:</b> ' + props.field_id + '<br>' +
                    '<b>Area:</b> ' + props.area_acres.toFixed(1) + ' acres<br>' +
                    '<b>Crop:</b> ' + props.crop_name + '<br>' +
                    '<hr style="margin: 8px 0;">' +
                    '<b>Soil Type:</b> ' + (props.compname || 'N/A') + '<br>' +
                    '<b>Drainage:</b> ' + (props.drainagecl || 'N/A') + '<br>' +
                    '<b>Organic Matter:</b> ' + (props.om_r ? props.om_r + '%' : 'N/A') + '<br>' +
                    '<b>pH:</b> ' + (props.ph1to1h2o_r || 'N/A') + '<br>' +
                    '<b>Clay:</b> ' + (props.claytotal_r ? props.claytotal_r + '%' : 'N/A') + '<br>' +
                    '<b>Sand:</b> ' + (props.sandtotal_r ? props.sandtotal_r + '%' : 'N/A') + '<br>' +
                    '<b>Silt:</b> ' + (props.silttotal_r ? props.silttotal_r + '%' : 'N/A');
                layer.bindPopup(popupContent);
            }
        }).addTo(map);

        map.fitBounds(fieldsLayer.getBounds());
